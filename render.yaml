services:
  - type: web
    name: calculadora-roi-verticale
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: WHATSAPP_NUMBER
        sync: false
      - key: LEAD_WEBHOOK_URL
        sync: false
      - key: PRIVACY_URL
        sync: false
